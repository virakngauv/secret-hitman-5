name: CI

on:
  pull_request:
    types:
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linked-issue:
    name: Linked issue
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require a closing issue reference
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          shopt -s nocasematch
          closing_pattern='(^|[[:space:]])(close(s|d)?|fix(es|ed)?|resolve(s|d)?):?[[:space:]]+([[:alnum:]_.-]+/[[:alnum:]_.-]+)?#[0-9]+'

          if [[ ! "$PR_BODY" =~ $closing_pattern ]]; then
            echo "Add a closing issue reference such as 'Closes #123' to the pull request description."
            exit 1
          fi

          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          linked_issue_count="$(
            gh api graphql \
              -f query='query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 1) {
                      totalCount
                    }
                  }
                }
              }' \
              -F owner="$repository_owner" \
              -F name="$repository_name" \
              -F number="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.totalCount'
          )"

          if [[ "$linked_issue_count" -lt 1 ]]; then
            echo 'The closing reference does not resolve to an issue that this pull request will close.'
            exit 1
          fi

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (${{ matrix.browser }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright against the local single-process game server
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      # 'retain-on-failure' keeps a trace.zip for every failed attempt,
      # including attempts that a retry rescued, so any retained trace means
      # the run failed or went flaky and is worth uploading.
      - name: Check for retained Playwright traces
        if: ${{ !cancelled() }}
        id: traces
        run: |
          traces="$(find test-results -name 'trace.zip' -print -quit 2>/dev/null || true)"
          if [[ -n "$traces" ]]; then
            echo 'retained=true' >> "$GITHUB_OUTPUT"
          else
            echo 'retained=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright results
        if: ${{ !cancelled() && steps.traces.outputs.retained == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  notify-portfolio:
    name: Notify portfolio
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Verify notification credentials
        env:
          APP_ID: ${{ vars.PORTFOLIO_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Configure PORTFOLIO_APP_ID and PORTFOLIO_APP_PRIVATE_KEY before enabling portfolio notifications."
            exit 1
          fi

      - name: Create portfolio-scoped token
        id: portfolio-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PORTFOLIO_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
          owner: virakngauv
          repositories: portfolio
          permission-contents: write

      - name: Notify portfolio of the tested revision
        env:
          GH_TOKEN: ${{ steps.portfolio-token.outputs.token }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            '{event_type: "upstream-ready", client_payload: {repository: $repository, sha: $sha}}' \
            > "$RUNNER_TEMP/portfolio-dispatch.json"
          gh api --method POST repos/virakngauv/portfolio/dispatches \
            --input "$RUNNER_TEMP/portfolio-dispatch.json"
